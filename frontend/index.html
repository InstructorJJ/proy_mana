    <title>Agente de IA el Maná</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

      :root {
        --bg: #080c16;
        --bg-glow-cyan: rgba(56, 189, 248, .16);
        --bg-glow-gold: rgba(212, 175, 55, .10);
        --surface: rgba(19, 27, 46, .82);
        --surface-solid: #121a2c;
        --surface-2: rgba(255, 255, 255, .04);
        --border-soft: rgba(255, 255, 255, .09);
        --text: #f3f5fb;
        --text-muted: #93a0bd;
        --metal-1: #f8ecc4;
        --metal-2: #d4af37;
        --metal-3: #7a5a1e;
        --accent: #d4af37;
        --accent-ink: #241a05;
        --cyan: #45c6f6;
        --ok: #3ddc97;
        --danger: #f2685c;
        --danger-soft: rgba(242, 104, 92, .12);
        --radius-lg: 22px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
        --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        background:
          radial-gradient(760px 420px at 14% -6%, var(--bg-glow-cyan), transparent 50%),
          radial-gradient(640px 500px at 100% 18%, var(--bg-glow-gold), transparent 50%),
          var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        padding: clamp(14px, 3.4vw, 44px);
        min-height: 100vh;
      } 

      .console {
        width: 100%;
        max-width: 780px;
        display: flex;
        flex-direction: column;
        height: calc(100vh - clamp(28px, 6.8vw, 88px));
        min-height: 580px;
        background:
          linear-gradient(var(--surface-solid), var(--surface-solid)) padding-box,
          linear-gradient(155deg, var(--metal-1), var(--metal-2) 32%, var(--metal-3) 52%, var(--metal-1) 78%, var(--metal-2)) border-box;
        border: 1.4px solid transparent;
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow:
          0 30px 60px -20px rgba(0, 0, 0, .65),
          0 0 0 1px rgba(0, 0, 0, .35),
          0 2px 24px rgba(212, 175, 55, .08);
        position: relative;
      }

      /* -- Banner -- */

      .banner {
        width: 100%;
        line-height: 0;
        position: relative;
      }
      .banner::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 60%, var(--surface-solid) 100%);
      }
      .banner img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* -- Header -- */

      header {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-soft);
        background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--text-muted);
        flex-shrink: 0;
        transition: background .3s, box-shadow .3s;
      }
      .status-dot.online { background: var(--ok); box-shadow: 0 0 0 4px rgba(61, 220, 151, .18), 0 0 10px rgba(61, 220, 151, .5); }
      .status-dot.offline { background: var(--danger); box-shadow: 0 0 0 4px rgba(242, 104, 92, .16); }

      .header-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .header-title .name {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: .01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: linear-gradient(120deg, var(--metal-1), var(--metal-2) 55%, var(--metal-1));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .header-title .sub {
        font-family: var(--font-mono);
        font-size: 10.5px;
        letter-spacing: .04em;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      header .spacer { flex: 1; }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--border-soft);
        background: var(--surface-2);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 15px;
        flex-shrink: 0;
        transition: border-color .2s, color .2s;
      }
      .icon-btn:hover { border-color: var(--metal-2); color: var(--metal-1); }
      .icon-btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* -- Settings drawer -- */

      .settings {
        border-bottom: 1px solid var(--border-soft);
        background: rgba(0, 0, 0, .18);
        padding: 16px 20px;
        display: none;
        flex-direction: column;
        gap: 12px;
      }
      .settings.open { display: flex; }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--text-muted);
      }
      .field input {
        font-family: var(--font-mono);
        font-size: 12.5px;
        padding: 9px 11px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-soft);
        background: rgba(0, 0, 0, .25);
        color: var(--text);
      }
      .field input:read-only { color: var(--text-muted); }

      .settings-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .settings-row .field { flex: 1; min-width: 0; }

      .btn {
        font-family: var(--font-sans);
        font-size: 12.5px;
        font-weight: 500;
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-soft);
        background: var(--surface-2);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        transition: border-color .2s;
      }
      .btn:hover { border-color: var(--metal-2); }
      .btn.ghost-danger { color: var(--danger); }
      .btn.ghost-danger:hover { border-color: var(--danger); }

      /* -- Message log -- */

      .log {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .msg { display: flex; flex-direction: column; gap: 5px; max-width: 86%; }
      .msg.user { align-self: flex-end; align-items: flex-end; }
      .msg.agent { align-self: flex-start; align-items: flex-start; }
      .msg.system { align-self: center; max-width: 100%; align-items: center; }

      .msg .role {
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--text-muted);
        padding: 0 4px;
      }

      .msg.user .bubble {
        background: linear-gradient(135deg, var(--metal-1), var(--metal-2) 65%);
        color: var(--accent-ink);
        font-weight: 500;
        padding: 11px 16px;
        border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
        font-size: 14px;
        line-height: 1.55;
        box-shadow: 0 6px 16px -6px rgba(212, 175, 55, .45);
      }

      .msg.agent .bubble {
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        padding: 11px 15px;
        border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
        font-size: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
        text-align: justify;
      }

      .msg.system .bubble {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--danger);
        background: var(--danger-soft);
        border: 1px solid rgba(242, 104, 92, .28);
        padding: 9px 14px;
        border-radius: var(--radius-sm);
      }

      .meta {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        padding: 0 4px;
      }

      .typing {
        display: flex;
        gap: 4px;
        padding: 12px 15px;
        background: var(--surface-2);
        border: 1px solid var(--border-soft);
        border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
        width: fit-content;
      }
      .typing span {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--metal-2);
        animation: pulse 1.1s infinite ease-in-out;
      }
      .typing span:nth-child(2) { animation-delay: .15s; }
      .typing span:nth-child(3) { animation-delay: .3s; }
      @keyframes pulse { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .typing span { animation: none; opacity: .6; }
      }

      .prompts {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        padding: 0 20px 16px;
      }
      .chip {
        font-family: var(--font-mono);
        font-size: 11.5px;
        padding: 7px 13px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--surface-2);
        color: var(--text-muted);
        cursor: pointer;
        transition: border-color .2s, color .2s;
      }
      .chip:hover { border-color: var(--metal-2); color: var(--metal-1); }

      /* -- Composer -- */

      .composer {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        padding: 16px 18px;
        border-top: 1px solid var(--border-soft);
        background: snow;
      }

      .prompt-mark {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 600;
        color: var(--metal-2);
        font-size: 19px;
        line-height: 1;        
      }

      textarea#input {
        flex: 1;
        resize: none;
        max-height: 140px;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        padding: 11px 16px;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        background:      
          radial-gradient(760px 420px at 14% -6%, var(--bg-glow-cyan), transparent 50%),
          radial-gradient(640px 500px at 100% 18%, var(--bg-glow-gold), transparent 50%),
          var(--bg);
        color: var(--text);
      }
      textarea#input:focus-visible { outline-offset: 0; border-color: var(--metal-2); }
      textarea#input { caret-color: var(--bg-glow-gold); scrollbar-width: thin; scrollbar-color: var(--border-soft); }
      textarea#input::-webkit-scrollbar { width: 6px; }
      textarea#input::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

      .send-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(0,0,0,.2);
        background: linear-gradient(155deg, var(--metal-1), var(--metal-2) 60%, var(--metal-3));
        color: var(--accent-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 6px 16px -6px rgba(212, 175, 55, .55), inset 0 1px 0 rgba(255,255,255,.5);
        transition: transform .15s, filter .15s;
      }
      .send-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
      .send-btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }

      .log::-webkit-scrollbar { width: 8px; }
      .log::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }
    </style>
  </head>

        <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Enviar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20L20 12L4 4V10L14 12L4 14V20Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <script>
    (function () {
      const $ = (id) => document.getElementById(id);

      const log            = $('log');
      const input          = $('input');
      const sendBtn         = $('sendBtn');
      const statusDot       = $('statusDot');
      const statusSub       = $('statusSub');
      const agentNameLabel  = $('agentNameLabel');
      const settingsToggle  = $('settingsToggle');
      const settingsPanel   = $('settingsPanel');
      const apiBaseInput    = $('apiBaseInput');
      const saveSettings    = $('saveSettings');
      const sessionIdView   = $('sessionIdView');
      const newSessionBtn   = $('newSession');
      const promptsBar      = $('prompts');
      const particleBg      = $('particle-bg');

      const store = {
        get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      // --- Particle Background Generation ---
      function createParticle() {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          particleBg.appendChild(particle);

          const size = Math.random() * 2 + 1; // 1px to 3px
          const x = Math.random() * 100 + 'vw';
          const y = Math.random() * 100 + 'vh';
          const z = Math.random() * 500 - 250 + 'px'; // -250px to 250px for 3D depth
          const duration = Math.random() * 10 + 10; // 10s to 20s

          particle.style.width = `${size}px`;
          particle.style.height = `${size}px`;
          particle.style.left = x;
          particle.style.top = y;
          particle.style.setProperty('--x', x);
          particle.style.setProperty('--y', y);
          particle.style.setProperty('--z', z);
          particle.style.setProperty('--s', Math.random() * 1 + 0.5); // scale between 0.5 and 1.5
          particle.style.animationDuration = `${duration}s`;
          particle.style.animationDelay = `-${Math.random() * duration}s`; // Stagger animation start
      }

      for (let i = 0; i < 80; i++) {
          createParticle();
      }

      function defaultApiBase() {
        if (location.protocol.startsWith('http') && location.hostname !== '' ) {
          // Si esta página se sirve desde el mismo backend, úsalo por defecto.
          // Si se abre como archivo local o desde otro origen, apunta a localhost:8000.
          return location.origin.includes('localhost') || location.origin.includes('127.0.0.1')
            ? location.origin.replace(/:\d+$/, ':8000')
            : location.origin;
        }
        return 'http://localhost:8000';
      }

      function newSessionId() {
        return 'web_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
      }

      let apiBase   = store.get('agentApiBase', defaultApiBase());
      let sessionId = store.get('agentSessionId', newSessionId());
      store.set('agentSessionId', sessionId);

      apiBaseInput.value  = apiBase;
      sessionIdView.value = sessionId;

      function addMessage(role, text, meta) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;

        const roleLabel = document.createElement('div');
        roleLabel.className = 'role';
        roleLabel.textContent = role === 'user' ? 'tú' : role === 'agent' ? agentNameLabel.textContent : 'sistema';
        if (role !== 'system') wrap.appendChild(roleLabel);

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        wrap.appendChild(bubble);

        if (meta) {
          const metaEl = document.createElement('div');
          metaEl.className = 'meta';
          metaEl.textContent = meta;
          wrap.appendChild(metaEl);
        }

        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
        return wrap;
      }

      function showTyping() {
        const wrap = document.createElement('div');
        wrap.className = 'msg agent';
        wrap.id = 'typingIndicator';
        const t = document.createElement('div');
        t.className = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        wrap.appendChild(t);
        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
      }

      function hideTyping() {
        const el = $('typingIndicator');
        if (el) el.remove();
      }

      async function checkHealth() {
        try {
          const res = await fetch(apiBase + '/health/detail', { signal: AbortSignal.timeout(6000) });
          if (!res.ok) throw new Error('bad status');
          const data = await res.json();
          statusDot.className = 'status-dot online';
          agentNameLabel.textContent = data.agente || 'Agente de IA';
          statusSub.textContent = (data.proveedor || 'groq') + ' · ' + (data.modelo || 'modelo desconocido');
          return true;
        } catch (e) {
          statusDot.className = 'status-dot offline';
          statusSub.textContent = 'sin conexión — revisa la URL de la API';
          return false;
        }
      }

      async function sendMessage(text) {
        addMessage('user', text);
        input.value = '';
        autoResize();
        sendBtn.disabled = true;
        showTyping();

        try {
          const res = await fetch(apiBase + '/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensaje: text, session_id: sessionId }),
          });

          hideTyping();

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            addMessage('system', 'Error ' + res.status + ': ' + (err.detail || 'no se pudo procesar la solicitud.'));
            return;
          }

          const data = await res.json();
          const hora = new Date(data.timestamp || Date.now()).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
          const etiquetas = {
            atencion_cliente: 'atención al cliente',
            documentos: 'rag/documentos',
            analisis: 'multiagente',
            reporte: 'estructurado'
          };
          const modo = etiquetas[data.categoria] || data.categoria || '';
          let metaTexto = hora + (modo ? ' · modo: ' + modo : '');
          if (data.fuentes && data.fuentes.length) metaTexto += ' · fuentes: ' + data.fuentes.join(', ');
          addMessage('agent', data.respuesta, metaTexto);
        } catch (e) {
          hideTyping();
          addMessage('system', 'No se pudo conectar con ' + apiBase + '. ¿Está el servidor corriendo?');
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      function autoResize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      input.addEventListener('input', autoResize);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = input.value.trim();
          if (text) sendMessage(text);
        }
      });

      sendBtn.addEventListener('click', () => {
        const text = input.value.trim();
        if (text) sendMessage(text);
      });

      promptsBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip');
        if (!btn) return;
        sendMessage(btn.dataset.prompt);
      });

      settingsToggle.addEventListener('click', () => {
        settingsPanel.classList.toggle('open');
      });

      saveSettings.addEventListener('click', () => {
        const val = apiBaseInput.value.trim().replace(/\/$/, '');
        if (val) {
          apiBase = val;
          store.set('agentApiBase', apiBase);
          checkHealth();
          addMessage('system', 'URL de la API actualizada a ' + apiBase);
        }
      });

      newSessionBtn.addEventListener('click', () => {
        sessionId = newSessionId();
        store.set('agentSessionId', sessionId);
        sessionIdView.value = sessionId;
        log.innerHTML = '';
        addMessage('system', 'Nueva conversación iniciada — la memoria previa quedó fuera de esta sesión.');
      });

      // ── Estado inicial ──────────────────────────────────
      addMessage('agent', 'Hola, soy el Agente el Maná 👋, tu asistente de atención al cliente y empleados de Industria de Alimentos el Maná. Puedo ayudarte con información sobre nuestras sedes, horarios, contacto, misión, visión, productos, precios, disponibilidad y descuentos. También puedo consultar documentos internos (política comercial, protocolo, RRHH, plan estratégico) y generar reportes ejecutivos o análisis de ventas. Prueba con las preguntas de abajo 👇');
      checkHealth();
      input.focus();
    })();
    </script>
  </body>
</html>
